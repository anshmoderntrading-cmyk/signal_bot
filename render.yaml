services:
  # FREE plan: a web service + a small health endpoint.
  # A free service sleeps after 15 min without traffic, so ping its URL
  # every 5-10 minutes from cron-job.org / UptimeRobot (see README).
  - type: web
    name: telegram-signal-bot
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false            # enter it in the Render dashboard
      - key: SYMBOLS
        value: EURUSD,GBPUSD,USDJPY,AUDUSD,AUDJPY,EURJPY,GBPJPY,USDCAD,NZDUSD,EURGBP
      - key: EXPIRY_MINUTES
        value: "1"
      - key: MIN_SCORE
        value: "4"
