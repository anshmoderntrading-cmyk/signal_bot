services:
  - type: worker              # background worker = runs 24/7 (paid Starter plan)
    name: telegram-signal-bot
    runtime: docker
    plan: starter
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false            # enter it in the Render dashboard
      - key: SYMBOLS
        value: EURUSD,GBPUSD,USDJPY,AUDUSD,BTCUSDT,ETHUSDT
      - key: EXPIRY_MINUTES
        value: "1"
      - key: MIN_SCORE
        value: "4"
